name: Simple CI/CD Demo

# Trigger when code is merged to release branch
on:
  push:
    branches: [ release ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Production Server
      run: |
        echo "🚀 Deploying to Production Server..."
        
        # Copy app from current directory to Production Server
        mkdir -p "../Production Server"
        cp "app.py" "../Production Server/"
        
        # Create simple requirements.txt for production
        echo "Flask==2.3.3" > "../Production Server/requirements.txt"
        
        echo "✅ Deployment completed!"
    
    - name: Commit production deployment
      run: |
        git config --local user.email "chongthamkaj@gmail.com"
        git config --local user.name "pankaj-chongtham"
        git add "../Production Server/"
        git diff --staged --quiet || git commit -m "🚀 Deploy to production from release branch"
        git push || echo "No changes to push"
